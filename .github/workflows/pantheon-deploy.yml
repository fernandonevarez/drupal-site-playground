name: Build & Deploy to Pantheon Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history (Pantheon rejects shallow pushes)

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install Terminus
        run: |
          curl -L https://github.com/pantheon-systems/terminus/releases/latest/download/terminus.phar -o terminus
          chmod +x terminus
          sudo mv terminus /usr/local/bin/terminus

      - name: Authenticate with Pantheon
        env:
          PANTHEON_MACHINE_TOKEN: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
        run: |
          terminus auth:login --machine-token="$PANTHEON_MACHINE_TOKEN"
          terminus auth:whoami

      - name: Prepare CI SSH key for Pantheon Git
        env:
          PANTHEON_SSH_PRIVATE_KEY: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$PANTHEON_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host *\n  IdentitiesOnly yes\n" >> ~/.ssh/config

      - name: 'Debug: print CI key fingerprint'
        run: |
          ssh-keygen -y -f ~/.ssh/id_rsa | ssh-keygen -lf - | sed 's/^/CI key fingerprint: /'

      - name: Add Pantheon codeserver host key to known_hosts (auto-fallback)
        run: |
          set -e
          GIT_URL=$(terminus connection:info drupal-site-playground.dev --field=git_url || true)
          echo "Pantheon Git URL is: ${GIT_URL:-<empty>}"
          if [ -n "$GIT_URL" ]; then
            HOST=$(echo "$GIT_URL" | sed -E 's|ssh://([^@]+)@([^:/]+):([0-9]+)/.*|\2|')
            PORT=$(echo "$GIT_URL" | sed -E 's|ssh://([^@]+)@([^:/]+):([0-9]+)/.*|\3|')
          else
            HOST="codeserver.dev.f6f897b9-9fd4-4435-ab9d-588b87d6586f.drush.in"
            PORT="2222"
          fi
          echo "Adding $HOST:$PORT to known_hosts"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure Pantheon Dev is in Git mode
        run: terminus connection:set drupal-site-playground.dev git

      - name: 'Sanity: ls-remote with CI key'
        env:
          GIT_SSH_COMMAND: 'ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/id_rsa'
        run: |
          GIT_URL=$(terminus connection:info drupal-site-playground.dev --field=git_url)
          echo "GIT_URL=$GIT_URL"
          git ls-remote "$GIT_URL"

      - name: Ensure full history (unshallow)
        run: |
          git fetch --prune --unshallow --tags || true
          git rev-parse --is-shallow-repository && echo "(still shallow?)" || echo "repo is full clone"

      - name: Deploy branch to Pantheon Dev
        env:
          GIT_SSH_COMMAND: 'ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/id_rsa'
        run: |
          GIT_URL=$(terminus connection:info drupal-site-playground.dev --field=git_url)
          git remote add pantheon "$GIT_URL" || git remote set-url pantheon "$GIT_URL"
          git show -s --oneline    # which commit we're deploying
          git push pantheon HEAD:main --force

      - name: Post-deploy — apply config/db changes (safe no-op)
        run: |
          SITE="drupal-site-playground.dev"
          # Import config if there is any; otherwise don’t fail the job
          terminus drush $SITE -- cim -y || echo "No config to import"
          # Run DB updates (idempotent: only runs what’s pending)
          terminus drush $SITE -- updb -y
          # Clear caches so changes are live
          terminus drush $SITE -- cr
